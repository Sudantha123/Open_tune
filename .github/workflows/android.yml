name: Build OpenTune APK

on:
  # Manually trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      flavor:
        description: 'ABI flavor'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - universal
          - armeabi

  # Auto build on push to main/master
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'innertube/**'
      - 'build.gradle.kts'
      - 'gradle.properties'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1          # shallow clone — faster

      # ── 2. Java ────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle           # cache ~/.gradle automatically

      # ── 3. Gradle cache ────────────────────────────────────────────────────
      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 4. Permissions ─────────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 5. Determine task ──────────────────────────────────────────────────
      - name: Set build variables
        id: vars
        run: |
          # When triggered by push, always build arm64 debug
          FLAVOR="${{ github.event.inputs.flavor || 'arm64' }}"
          TYPE="${{ github.event.inputs.build_type || 'debug' }}"

          # Capitalise first letter for Gradle task name  e.g. arm64 + Debug = assembleArm64Debug
          FLAVOR_CAP="$(echo ${FLAVOR:0:1} | tr a-z A-Z)${FLAVOR:1}"
          TYPE_CAP="$(echo ${TYPE:0:1} | tr a-z A-Z)${TYPE:1}"

          echo "task=assemble${FLAVOR_CAP}${TYPE_CAP}" >> $GITHUB_OUTPUT
          echo "flavor=$FLAVOR"                         >> $GITHUB_OUTPUT
          echo "type=$TYPE"                             >> $GITHUB_OUTPUT
          echo "artifact_name=OpenTune-${FLAVOR}-${TYPE}" >> $GITHUB_OUTPUT

      # ── 6. Keystore (release only) ─────────────────────────────────────────
      - name: Decode keystore
        if: steps.vars.outputs.type == 'release'
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore/release.keystore
        # Required secrets in your repo Settings → Secrets:
        #   KEYSTORE_BASE64  — base64-encoded .keystore file
        #   STORE_PASSWORD   — keystore password
        #   KEY_ALIAS        — key alias
        #   KEY_PASSWORD     — key password

      # ── 7. Build ───────────────────────────────────────────────────────────
      - name: Build ${{ steps.vars.outputs.artifact_name }}
        run: ./gradlew ${{ steps.vars.outputs.task }} --no-daemon --stacktrace
        env:
          # Gradle JVM — GitHub runners have 7 GB RAM
          GRADLE_OPTS: "-Xmx5g -XX:+UseParallelGC"
          # Signing (only used when release keystore is decoded above)
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}

      # ── 8. Find APK path ───────────────────────────────────────────────────
      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"
          ls -lh "$APK"

      # ── 9. Upload artifact ─────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ── 10. Build summary ──────────────────────────────────────────────────
      - name: Build summary
        run: |
          APK="${{ steps.apk.outputs.path }}"
          SIZE=$(du -h "$APK" | cut -f1)
          echo "## ✅ Build complete" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Flavor** | ${{ steps.vars.outputs.flavor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Type** | ${{ steps.vars.outputs.type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK size** | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| **File** | \`$(basename $APK)\` |" >> $GITHUB_STEP_SUMMARY
          
